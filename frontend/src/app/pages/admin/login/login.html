<main class="admin-login">
  <section class="login-card">
    <div class="login-heading">
      <span class="login-eyebrow">BMG İNŞAAT</span>
      <h1>Yönetim Paneli</h1>
      <p>Devam etmek için yönetici hesabınızla giriş yapın.</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">E-posta Adresi</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="E-posta adresinizi girin"
          autocomplete="email" maxlength="256" required />
      </div>

      <div class="form-field">
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Şifrenizi girin"
          autocomplete="current-password" required />
      </div>


      <p class="forgot-password-link">
        <a href="/admin/forgot-password">Şifremi Unuttum</a>
      </p>



      <button type="submit" class="login-button" [disabled]="loading || !email.trim() || !password">
        {{ loading ? 'Giriş Yapılıyor...' : 'Giriş Yap' }}
      </button>
      @if (errorMessage) {
      <p class="login-error" role="alert">
        {{ errorMessage }}
      </p>
      }
    </form>

    <p class="login-footer">
      © 2026 BMG İnşaat. Yetkili kullanıcı erişimi.
    </p>
  </section>
</main>
